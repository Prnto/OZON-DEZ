<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <!-- Outer circular glow -->
  <circle cx="24" cy="24" r="22" fill="rgba(239, 68, 68, 0.14)" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.4"/>
  
  <!-- Realistic Sharp Cockroach Silhouette (Bright White & Silver for High Contrast) -->
  <g fill="#f8fafc" stroke="#f8fafc">
    <!-- Long Swept-Back Antennae -->
    <path d="M22 12.5 C20 7, 13 5, 7.5 4" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M26 12.5 C28 7, 35 5, 40.5 4" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    
    <!-- Head & Mouthparts -->
    <path d="M22.5 11.5 C22.5 10.2 23.2 9.5 24 9.5 C24.8 9.5 25.5 10.2 25.5 11.5 L25.2 13.5 L22.8 13.5 Z" stroke-width="0.5"/>
    
    <!-- Pronotum (Upper Thorax Shield) -->
    <path d="M19 14 C19 13 21 12.2 24 12.2 C27 12.2 29 13 29 14 C29.5 16.5 28.5 18 24 18 C19.5 18 18.5 16.5 19 14 Z" stroke-width="0.5"/>
    
    <!-- Cockroach Wings / Abdomen Body -->
    <path d="M18.8 18 C17.2 22.5 17.2 29.5 24 35 C30.8 29.5 30.8 22.5 29.2 18 Z" stroke-width="0.5"/>
    <!-- Wing Elytra Division Line -->
    <line x1="24" y1="18" x2="24" y2="34" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- 6 Articulated Jointed Legs -->
    <!-- Left Legs -->
    <path d="M19 16 L13.5 13.5 L9.5 11" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M18.2 20.5 L12 21.5 L7.5 24.5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M18.8 25.5 L13 28.5 L9 35" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Right Legs -->
    <path d="M29 16 L34.5 13.5 L38.5 11" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M29.8 20.5 L36 21.5 L40.5 24.5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M29.2 25.5 L35 28.5 L39 35" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Rear Cerci Spines -->
    <path d="M22 34 L19.5 38.5 M26 34 L28.5 38.5" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Bold Red Prohibition Ring & Slash -->
  <circle cx="24" cy="24" r="18.5" stroke="#ef4444" stroke-width="3.2" fill="none"/>
  <line x1="10.8" y1="10.8" x2="37.2" y2="37.2" stroke="#ef4444" stroke-width="3.2" stroke-linecap="round"/>
</svg>