<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <!-- Subtle HUD ambient glow -->
  <circle cx="24" cy="24" r="17.5" fill="rgba(163, 230, 53, 0.1)"/>
  
  <!-- HUD Crosshair Reticle Ring -->
  <circle cx="24" cy="24" r="17.5" stroke="#a3e635" stroke-width="2.4"/>
  
  <!-- Reticle Ticks (North, South, West, East) -->
  <line x1="24" y1="2" x2="24" y2="9.5" stroke="#a3e635" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="24" y1="38.5" x2="24" y2="46" stroke="#a3e635" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="2" y1="24" x2="9.5" y2="24" stroke="#a3e635" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="38.5" y1="24" x2="46" y2="24" stroke="#a3e635" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Cockroach Silhouette in HUD Neon Green -->
  <g fill="#a3e635" stroke="#a3e635">
    <!-- Antennae -->
    <path d="M22.5 15 C20 11, 15 9.5, 11 9" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <path d="M25.5 15 C28 11, 33 9.5, 37 9" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    
    <!-- Head -->
    <ellipse cx="24" cy="15" rx="1.8" ry="1.5"/>
    
    <!-- Pronotum (Thorax) -->
    <path d="M20.5 17.5 C20.5 16.5 22 15.8 24 15.8 C26 15.8 27.5 16.5 27.5 17.5 C27.5 19 26 19.8 24 19.8 C22 19.8 20.5 19 20.5 17.5 Z"/>
    
    <!-- Body / Abdomen -->
    <ellipse cx="24" cy="25" rx="4.5" ry="7.2"/>
    
    <!-- Legs (Left) -->
    <path d="M20 18.5 L15 17 L12 15" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M19.5 23 L14 24 L11 26.5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M20 28 L15 31 L12 36" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Legs (Right) -->
    <path d="M28 18.5 L33 17 L36 15" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M28.5 23 L34 24 L37 26.5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M28 28 L33 31 L36 36" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Tail spines -->
    <path d="M22.5 32 L21 34.5 M25.5 32 L27 34.5" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Diagonal Prohibition Slash Across HUD Target -->
  <line x1="11.5" y1="36.5" x2="36.5" y2="11.5" stroke="#a3e635" stroke-width="2.5" stroke-linecap="round"/>
</svg>