<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Subtle circular backdrop -->
  <circle cx="32" cy="32" r="28" fill="rgba(255, 255, 255, 0.04)"/>
  
  <!-- Outer Red Prohibition Ring -->
  <circle cx="32" cy="32" r="27" stroke="#dc2626" stroke-width="4.5"/>

  <!-- Target Pests Inside -->
  <g fill="#e2e8f0" stroke="#e2e8f0">
    <!-- 1. Cockroach (Bottom Left) -->
    <!-- Antennae -->
    <path d="M19 39 C16 35, 13 34, 10 33" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M22 39 C22 34, 21 31, 18 28" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <!-- Head & Body -->
    <ellipse cx="20.5" cy="40.5" rx="1.6" ry="1.4"/>
    <path d="M18.5 42 C18.5 41 19.5 40.5 21 40.5 C22.5 40.5 23.5 41 23.5 42 C23.5 43 22.5 43.5 21 43.5 C19.5 43.5 18.5 43 18.5 42 Z"/>
    <ellipse cx="22" cy="47" rx="3.5" ry="5.5" transform="rotate(-15 22 47)"/>
    <!-- Legs -->
    <path d="M18 43 L14 43 L11 41" stroke-width="1.1" stroke-linecap="round" fill="none"/>
    <path d="M18 46 L13 48 L10 51" stroke-width="1.1" stroke-linecap="round" fill="none"/>
    <path d="M24 44 L28 44 L30 42" stroke-width="1.1" stroke-linecap="round" fill="none"/>
    <path d="M25 48 L29 51 L31 54" stroke-width="1.1" stroke-linecap="round" fill="none"/>

    <!-- 2. Tick / Mite (Top Right) -->
    <ellipse cx="44" cy="22" rx="3.8" ry="4.5"/>
    <ellipse cx="44" cy="17" rx="1.5" ry="1.2"/>
    <!-- Tick Legs (4 pairs) -->
    <path d="M41 18 L37 16" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M41 20 L36 20" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M41 23 L36 25" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M42 25 L38 29" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M47 18 L51 16" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M47 20 L52 20" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M47 23 L52 25" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M46 25 L50 29" stroke-width="1.2" stroke-linecap="round" fill="none"/>

    <!-- 3. Flying Wasp / Bedbug (Top Left) -->
    <ellipse cx="22" cy="21" rx="2.2" ry="3.5" transform="rotate(30 22 21)"/>
    <ellipse cx="24" cy="18" rx="1.2" ry="1.2"/>
    <!-- Wings -->
    <ellipse cx="18" cy="18" rx="3.5" ry="1.5" fill="none" stroke-width="1" transform="rotate(-25 18 18)"/>
    <ellipse cx="25" cy="24" rx="3" ry="1.3" fill="none" stroke-width="1" transform="rotate(45 25 24)"/>
    <path d="M20 23 L17 26" stroke-width="1" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Diagonal Red Prohibition Slash -->
  <line x1="12.9" y1="12.9" x2="51.1" y2="51.1" stroke="#dc2626" stroke-width="4.5" stroke-linecap="round"/>
</svg>