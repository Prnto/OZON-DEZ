<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <!-- Amber / Gold Glow Aura -->
  <circle cx="24" cy="24" r="22" fill="rgba(245, 158, 11, 0.14)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.45"/>

  <!-- Protective Outer Audit Shield -->
  <path d="M 24 5 
           C 29 7.5, 36 8.5, 39 10.5 
           C 39 19, 37 30, 24 38 
           C 11 30, 9 19, 9 10.5 
           C 12 8.5, 19 7.5, 24 5 Z" 
        fill="rgba(245, 158, 11, 0.12)" 
        stroke="#f59e0b" 
        stroke-width="1.8" 
        stroke-linejoin="round"/>

  <!-- Precision Optical Crosshairs / Radar Target Reticle (Pest Monitoring) -->
  <circle cx="24" cy="21" r="11" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="2 2" fill="none"/>
  <circle cx="24" cy="21" r="6" stroke="#fbbf24" stroke-width="1.2" fill="none"/>
  <!-- Target Crosshair Lines -->
  <line x1="24" y1="7" x2="24" y2="13" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="29" x2="24" y2="35" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <line x1="10" y1="21" x2="16" y2="21" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="21" x2="38" y2="21" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- Pest Silhouette Locked in the Crosshairs Center -->
  <g fill="#ffffff">
    <!-- Antennae -->
    <path d="M 23 18 L 21 16 M 25 18 L 27 16" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="24" cy="18.5" r="1.3"/>
    <!-- Thorax & Abdomen -->
    <ellipse cx="24" cy="22" rx="2.5" ry="3.5"/>
    <!-- Legs in Reticle -->
    <path d="M 21.5 20.5 L 19 19 M 21.5 22.5 L 18.5 23 M 21.5 24.5 L 19 26.5" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
    <path d="M 26.5 20.5 L 29 19 M 26.5 22.5 L 29.5 23 M 26.5 24.5 L 29 26.5" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- HACCP Certification Pill Badge at Bottom -->
  <rect x="12" y="37" width="24" height="9.5" rx="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="0.8"/>
  <text x="24" y="44" text-anchor="middle" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="6.8" letter-spacing="0.04em">HACCP</text>
</svg>