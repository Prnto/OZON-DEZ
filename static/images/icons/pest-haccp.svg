<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Subtle circular backdrop -->
  <circle cx="32" cy="32" r="28" fill="rgba(255, 255, 255, 0.04)"/>
  
  <!-- Outer Red Prohibition Ring -->
  <circle cx="32" cy="32" r="27" stroke="#dc2626" stroke-width="4.5"/>

  <!-- HACCP Facility Protection Shield & Controlled Pest Inside -->
  <g fill="#e2e8f0" stroke="#e2e8f0">
    <!-- HACCP Shield Contour (Center Right) -->
    <path d="M42 16 L49 19 C49 27, 46 33, 42 36 C38 33, 35 27, 35 19 Z" stroke-width="1.6" fill="rgba(255, 255, 255, 0.08)"/>
    <!-- Checkmark inside Shield -->
    <path d="M39 26 L41 28 L46 22" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Pests Being Controlled on Commercial Site (Bottom Left) -->
    <!-- Small Cockroach / Bug Silhouette -->
    <ellipse cx="23" cy="38" rx="2.8" ry="4.2" transform="rotate(-20 23 38)"/>
    <circle cx="21" cy="33" r="1.3"/>
    <path d="M20 32 L16 30 M22 32 L22 28" stroke-width="1" stroke-linecap="round" fill="none"/>
    <path d="M20 37 L16 37 M20 40 L16 42" stroke-width="1" stroke-linecap="round" fill="none"/>
    <path d="M26 36 L29 36 M25 39 L28 42" stroke-width="1" stroke-linecap="round" fill="none"/>

    <!-- Small Mouse Silhouette (Bottom) -->
    <ellipse cx="30" cy="48" rx="4" ry="2.6"/>
    <circle cx="26" cy="48" r="1.3"/>
    <path d="M34 49 C37 50, 39 52, 38 54" stroke-width="1" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Diagonal Red Prohibition Slash -->
  <line x1="12.9" y1="12.9" x2="51.1" y2="51.1" stroke="#dc2626" stroke-width="4.5" stroke-linecap="round"/>
</svg>