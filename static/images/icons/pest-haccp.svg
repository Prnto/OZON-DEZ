<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <!-- Subtle HUD ambient glow -->
  <circle cx="24" cy="24" r="17.5" fill="rgba(245, 158, 11, 0.1)"/>
  
  <!-- HUD Crosshair Reticle Ring -->
  <circle cx="24" cy="24" r="17.5" stroke="#f59e0b" stroke-width="2.4"/>
  
  <!-- Reticle Ticks (North, South, West, East) -->
  <line x1="24" y1="2" x2="24" y2="9.5" stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="24" y1="38.5" x2="24" y2="46" stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="2" y1="24" x2="9.5" y2="24" stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="38.5" y1="24" x2="46" y2="24" stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round"/>

  <!-- HACCP Pest Control Security Shield & Radar Cross -->
  <g fill="#f59e0b">
    <!-- Outer Shield Crest -->
    <path d="M 24 14.5
             L 32 17.5
             C 32 24.5 28.5 29.5 24 32.5
             C 19.5 29.5 16 24.5 16 17.5
             Z"/>
    
    <!-- Verified Security Checkmark inside Shield -->
    <path d="M 20.5 23 L 23 25.5 L 27.5 19.8"
          stroke="#0b0f19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- HACCP Standard Label -->
    <text x="24" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="4.2" font-weight="900" fill="#0b0f19" text-anchor="middle" letter-spacing="0.4">HACCP</text>
  </g>
</svg>