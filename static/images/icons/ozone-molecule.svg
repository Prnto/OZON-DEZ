<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <!-- Subtle HUD ambient glow -->
  <circle cx="24" cy="24" r="17.5" fill="rgba(168, 85, 247, 0.1)"/>
  
  <!-- HUD Crosshair Reticle Ring -->
  <circle cx="24" cy="24" r="17.5" stroke="#a855f7" stroke-width="2.4"/>
  
  <!-- Reticle Ticks (North, South, West, East) -->
  <line x1="24" y1="2" x2="24" y2="9.5" stroke="#a855f7" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="24" y1="38.5" x2="24" y2="46" stroke="#a855f7" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="2" y1="24" x2="9.5" y2="24" stroke="#a855f7" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="38.5" y1="24" x2="46" y2="24" stroke="#a855f7" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Ozone O3 Triatomic Molecule & Active Gas Halo -->
  <g fill="#a855f7" stroke="#a855f7">
    <!-- Chemical Bonds -->
    <line x1="22.5" y1="20" x2="19" y2="26" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="25.5" y1="20" x2="29" y2="26" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="20" y1="28.5" x2="28" y2="28.5" stroke-width="1.2" stroke-dasharray="1.5 1.5" stroke-linecap="round"/>

    <!-- Oxygen Atoms (O) -->
    <circle cx="24" cy="18" r="4.2"/>
    <circle cx="17.5" cy="28.5" r="4.2"/>
    <circle cx="30.5" cy="28.5" r="4.2"/>

    <!-- Inner Nucleus Sparkles -->
    <circle cx="24" cy="18" r="1.4" fill="#ffffff" stroke="none"/>
    <circle cx="17.5" cy="28.5" r="1.4" fill="#ffffff" stroke="none"/>
    <circle cx="30.5" cy="28.5" r="1.4" fill="#ffffff" stroke="none"/>
  </g>

  <!-- O3 Text Indicator in center -->
  <text x="24" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="6.8" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">O₃</text>
</svg>