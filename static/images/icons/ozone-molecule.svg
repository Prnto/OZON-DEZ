<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Subtle circular backdrop -->
  <circle cx="32" cy="32" r="28" fill="rgba(255, 255, 255, 0.04)"/>
  
  <!-- Outer Red Prohibition Ring -->
  <circle cx="32" cy="32" r="27" stroke="#dc2626" stroke-width="4.5"/>

  <!-- Mold, Odor Waves, Mold Spores & O3 Ozone Active Oxygen Symbol Inside -->
  <g fill="#e2e8f0" stroke="#e2e8f0">
    <!-- Pungent Odor / Mold Fumes Waves (Bottom Left) -->
    <path d="M16 48 C16 43, 20 42, 20 37 C20 33, 17 31, 18 27" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M21 50 C21 45, 25 44, 25 39 C25 35, 22 33, 23 29" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    
    <!-- Mold Spore / Fungus head -->
    <circle cx="21" cy="46" r="2.4"/>
    <circle cx="16" cy="42" r="1.8"/>

    <!-- Active O3 Ozone Gas Molecule Structure (Top Right) -->
    <circle cx="38" cy="22" r="3.2"/>
    <circle cx="46" cy="27" r="3.2"/>
    <circle cx="44" cy="18" r="2.8"/>
    <!-- Bonds between Oxygen atoms -->
    <line x1="40.5" y1="23.5" x2="43.5" y2="25.5" stroke-width="1.6"/>
    <line x1="40" y1="20.5" x2="42" y2="19" stroke-width="1.6"/>
    <line x1="44.8" y1="20.5" x2="45.5" y2="24" stroke-width="1.6"/>

    <!-- Subscript text O3 -->
    <text x="35" y="38" font-size="9" font-family="system-ui, sans-serif" font-weight="800" fill="#e2e8f0" stroke="none">O₃</text>
  </g>

  <!-- Diagonal Red Prohibition Slash -->
  <line x1="12.9" y1="12.9" x2="51.1" y2="51.1" stroke="#dc2626" stroke-width="4.5" stroke-linecap="round"/>
</svg>