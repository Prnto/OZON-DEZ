<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <!-- Subtle HUD ambient glow -->
  <circle cx="24" cy="24" r="17.5" fill="rgba(56, 189, 248, 0.1)"/>
  
  <!-- HUD Crosshair Reticle Ring -->
  <circle cx="24" cy="24" r="17.5" stroke="#38bdf8" stroke-width="2.4"/>
  
  <!-- Reticle Ticks (North, South, West, East) -->
  <line x1="24" y1="2" x2="24" y2="9.5" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="24" y1="38.5" x2="24" y2="46" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="2" y1="24" x2="9.5" y2="24" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="38.5" y1="24" x2="46" y2="24" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Bacterium / Pathogen Silhouette with outer spikes -->
  <g fill="#38bdf8" stroke="#38bdf8">
    <!-- Radiating Spikes / Flagella around bacterium -->
    <line x1="20" y1="16" x2="18.5" y2="14" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="24" y1="15.5" x2="24" y2="13" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="28" y1="16" x2="29.5" y2="14" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="31" y1="19" x2="33.5" y2="18" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="33" y1="23" x2="35.5" y2="23" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="32.5" y1="27" x2="35" y2="28" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="30" y1="31" x2="32" y2="33" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="26" y1="32.5" x2="26.5" y2="35" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="22" y1="32.5" x2="21.5" y2="35" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="18" y1="31" x2="16" y2="33" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="15.5" y1="27" x2="13" y2="28" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="15" y1="23" x2="12.5" y2="23" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="16.5" y1="19" x2="14" y2="18" stroke-width="1.3" stroke-linecap="round"/>

    <!-- Curved Bean-Shaped Bacterium Body -->
    <path d="M 22 17
             C 27 16.5 32 19 31.5 24
             C 31 28.5 28 32 23 31.5
             C 18 31 16 27.5 17 23.5
             C 17.5 21 19 17.5 22 17 Z"/>

    <!-- Inner Organelle / Spore dots (cutouts) -->
    <circle cx="21" cy="22" r="1.2" fill="#090d16" stroke="none"/>
    <circle cx="25" cy="20" r="1.6" fill="#090d16" stroke="none"/>
    <circle cx="26" cy="26" r="1.3" fill="#090d16" stroke="none"/>
    <circle cx="22" cy="27" r="1.1" fill="#090d16" stroke="none"/>
  </g>

  <!-- Diagonal Prohibition Slash Across HUD Target -->
  <line x1="11.5" y1="36.5" x2="36.5" y2="11.5" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
</svg>