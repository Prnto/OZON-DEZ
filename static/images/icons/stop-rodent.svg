<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <!-- Outer circular glow -->
  <circle cx="24" cy="24" r="22" fill="rgba(239, 68, 68, 0.14)" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.4"/>
  
  <!-- Realistic Sharp Rat / Rodent Profile (Unmistakable Rodent Anatomy) -->
  <g fill="#f8fafc">
    <!-- Main Body & Head: Sharp Triangular Snout, Arched Rodent Back, Slender Neck, Distinct Hindquarters -->
    <path d="M 9.5 25.5 
             C 11 24.8, 14 23.8, 16 23.2 
             C 17 21.5, 17.5 19.5, 19 18.5 
             C 20.5 17.5, 22.5 18, 22.2 20.5 
             C 24 20, 27 20.2, 29.5 21.8 
             C 32.5 23.5, 34 26.2, 33.8 28.5 
             C 33.5 30.5, 31 31.5, 27.5 31.5 
             C 22 31.5, 17 31, 15.2 29 
             C 13 28, 10.5 26.8, 9.5 25.5 Z" />
    
    <!-- Rat Ear Inner Detail -->
    <path d="M 19.2 19.2 C 19.8 18.5, 21.2 18.8, 21 20.2 C 20.2 20.8, 19.5 20.2, 19.2 19.2 Z" fill="#cbd5e1"/>
    
    <!-- Eye (Sharp Rodent Eye) -->
    <circle cx="14" cy="23.8" r="1.1" fill="#0f172a"/>
    <circle cx="14.3" cy="23.5" r="0.4" fill="#ffffff"/>

    <!-- Slender Front Paw -->
    <path d="M 15.5 28.5 L 14.5 32 L 13 32.5" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Hind Foot (Elongated Rodent Foot with Claws) -->
    <path d="M 28 30 L 26.5 33.5 L 23.5 34" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Long Slender Whiplike Rat Tail (Sweeping S-curve) -->
    <path d="M 33.5 27.5 
             C 37 27, 40 24, 40.5 20 
             C 41 16, 38.5 13.5, 36 14.5 
             C 34.5 15.2, 34.8 17, 36 17.5" 
          stroke="#f8fafc" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    
    <!-- Fine Whiskers (Radiating from the Pointed Snout Tip) -->
    <path d="M 9.5 25 L 4.5 23.5 M 9.5 25.5 L 4 25.5 M 9.5 26 L 4.8 27.8" stroke="#f8fafc" stroke-width="1.1" stroke-linecap="round"/>
  </g>

  <!-- Bold Red Prohibition Ring & Slash -->
  <circle cx="24" cy="24" r="18.5" stroke="#ef4444" stroke-width="3.2" fill="none"/>
  <line x1="10.8" y1="10.8" x2="37.2" y2="37.2" stroke="#ef4444" stroke-width="3.2" stroke-linecap="round"/>
</svg>