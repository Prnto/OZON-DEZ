<!doctype html>
<html lang="uk">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#000000" />
		<meta name="description" content="ТОВ «ОЗОН-ДЕЗ» — Професійна дезінфекція, дезінсекція, озонування, дератизація та пест-контроль HACCP у м. Чорноморськ, Одесі та Одеській області. 15 років досвіду з 2011 року." />
		<meta name="keywords" content="дезінфекція Чорноморськ, дезінсекція Одеса, озонування, знищення тарганів, клопів, дератизація, пест контроль HACCP, ОЗОН-ДЕЗ, демеркуризація" />
		
		<!-- Open Graph -->
		<meta property="og:title" content="ТОВ «ОЗОН-ДЕЗ» — Санітарна безпека та пест-контроль HACCP (15 років досвіду)" />
		<meta property="og:description" content="15 років досвіду в дезінфекції, дезінсекції, озонуванні та пест-контролі HACCP у Чорноморську, Одесі та Одеській області. Офіс: просп. Миру, 8-А." />
		<meta property="og:image" content="%sveltekit.assets%/images/pest-cockroaches.webp" />

		<!-- Prevent theme flash on initial load -->
		<script>
			try {
				var savedTheme = localStorage.getItem('ozon_dez_theme') || 'dark';
				document.documentElement.setAttribute('data-theme', savedTheme);
				if (savedTheme === 'light') {
					document.documentElement.classList.add('theme-light');
				} else {
					document.documentElement.classList.add('theme-dark');
				}
			} catch (e) {}
		</script>

		<!-- Google Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
		
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
